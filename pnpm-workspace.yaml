allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true

autoInstallPeers: true

catalog:
  '@types/node': ^26.1.2
  'glob': ^13.0.6
  'globals': ^17.9.0
  'husky': ^9.1.7
  'lint-staged': ^17.3.0
  'storybook': ^10.5.6
  'syncpack': ^15.3.2
  'turbo': ^2.10.8
  'typescript': ^7.0.2

catalogs:
  commitlint:
    '@commitlint/cli': '^21.2.1'
    '@commitlint/config-conventional': '^21.2.0'
  eslint:
    '@types/eslint': '^9.6.1'
    '@eslint/eslintrc': '^3.3.6'
    '@eslint/js': '^9.39.5'
    '@next/eslint-plugin-next': '^16.3.0'
    '@typescript-eslint/eslint-plugin': '^8.66.0'
    'eslint-config-prettier': '^10.1.8'
    'eslint-import-resolver-alias': '^1.1.2'
    'eslint-import-resolver-typescript': '^4.4.5'
    'eslint-plugin-import': '^2.32.0'
    'eslint-plugin-jsx-a11y': '^6.10.2'
    'eslint-plugin-perfectionist': '^5.10.1'
    'eslint-plugin-prettier': '^5.5.6'
    'eslint-plugin-react': '^7.37.5'
    'eslint-plugin-react-hooks': '^7.1.1'
    'eslint-plugin-react-you-might-not-need-an-effect': '^1.0.1'
    'eslint-plugin-regexp': '^3.1.1'
    'eslint-plugin-simple-import-sort': '^14.0.0'
    'eslint-plugin-storybook': '^10.5.6'
    'eslint-plugin-turbo': ^2.10.8
    'eslint-plugin-unicorn': ^65.0.1
    'eslint-plugin-unused-imports': '^4.4.1'
    '@typescript-eslint/parser': '^8.66.0'
    'typescript-eslint': '^8.66.0'
    'eslint': ^9.39.5
  prettier:
    '@ianvs/prettier-plugin-sort-imports': '^4.7.1'
    '@prettier/plugin-xml': '^3.4.2'
    'prettier': ^3.9.6
    'prettier-plugin-packagejson': '^3.0.2'
    'prettier-plugin-sort-json': '^4.2.0'
    'prettier-plugin-tailwindcss': '^0.8.1'

packages:
  - packages/*
  - tooling/*

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.60.0'
  - '@typescript-eslint/parser@8.60.0'
  - '@typescript-eslint/project-service@8.60.0'
  - '@typescript-eslint/scope-manager@8.60.0'
  - '@typescript-eslint/tsconfig-utils@8.60.0'
  - '@typescript-eslint/type-utils@8.60.0'
  - '@typescript-eslint/types@8.60.0'
  - '@typescript-eslint/typescript-estree@8.60.0'
  - '@typescript-eslint/utils@8.60.0'
  - '@typescript-eslint/visitor-keys@8.60.0'
  - typescript-eslint@8.60.0
  - '@turbo/darwin-64@2.10.6'
  - '@turbo/darwin-arm64@2.10.6'
  - '@turbo/linux-64@2.10.6'
  - '@turbo/linux-arm64@2.10.6'
  - '@turbo/windows-64@2.10.6'
  - '@turbo/windows-arm64@2.10.6'
  - lint-staged@17.1.1
  - turbo@2.10.6
  - eslint-plugin-turbo@2.10.6
